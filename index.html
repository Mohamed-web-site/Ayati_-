<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Quraan — القرآن الكريم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap');

:root{
  --bg:#F5F1E6; --bg-deep:#EEE7D5;
  --ink:#16241D; --ink-soft:#516158; --ink-faint:#8B978F;
  --emerald-900:#08241C; --emerald-800:#0C3327; --emerald-700:#124334; --emerald-600:#195A44; --emerald-500:#217056;
  --gold-700:#9C7530; --gold-600:#B78A3F; --gold-500:#CBA25A; --gold-300:#E6CD98; --gold-100:#F4E9CE;
  --card:#FFFFFF; --line:rgba(18,44,33,.10); --line-strong:rgba(18,44,33,.18);
  --shadow-sm:0 2px 10px rgba(15,35,27,.06); --shadow-md:0 10px 28px rgba(12,30,23,.12); --shadow-lg:0 24px 60px rgba(8,25,18,.28);
  --r-lg:24px; --r-md:16px; --r-sm:11px; --r-pill:999px;
  --font-ui:'Cairo',system-ui,sans-serif; --font-quran:'Amiri Quran','Amiri',serif;
  --nav-h:66px; --topbar-h:58px; --safe-b:env(safe-area-inset-bottom,0px);
  --ayat-font-size:23px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; font-family:var(--font-ui); color:var(--ink); min-height:100%; overflow-x:hidden;}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0;}
input{font-family:inherit; color:inherit;}
::-webkit-scrollbar{width:0;height:0;} *{scrollbar-width:none;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
svg{width:20px;height:20px;flex-shrink:0;display:block;}
::selection{background:var(--gold-300);}

/* ---------- App shell (no fake phone chrome) ---------- */
.stage{
  min-height:100vh; min-height:100dvh; display:flex; justify-content:center;
  background: radial-gradient(1000px 600px at 20% 0%, rgba(230,205,152,.06), transparent 60%), var(--emerald-900);
}
#app{
  position:relative; width:100%; max-width:480px;
  min-height:100vh; min-height:100dvh;
  background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
  transition:background .3s ease;
  --app-bg-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/The_Kaaba_during_Hajj.jpg');
  --app-bg-opacity:.07;
}
#app::before{
  content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background-image:var(--app-bg-image); background-size:cover; background-position:center;
  opacity:var(--app-bg-opacity); transition:opacity .3s ease;
}
@media (min-width:561px){ #app{ box-shadow:0 0 70px rgba(0,0,0,.30); } }

/* ---------- Splash ---------- */
#splash{
  position:absolute; inset:0; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:linear-gradient(180deg, var(--emerald-900) 0%, var(--emerald-800) 55%, var(--emerald-700) 100%);
  transition:opacity .6s ease, visibility .6s ease;
}
#splash::before{
  content:''; position:absolute; inset:0;
  background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/The_Kaaba_during_Hajj.jpg');
  background-size:cover; background-position:center 40%; opacity:.16; mix-blend-mode:luminosity;
}
#splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
.splash-mark{position:relative; z-index:1; font-size:15px; letter-spacing:.35em; color:var(--gold-300); font-weight:600;}
.splash-title{position:relative; z-index:1; font-family:var(--font-quran); font-size:44px; color:#fff; text-align:center;}
.splash-ring{position:relative; z-index:1; width:46px; height:46px; border-radius:50%; border:2.5px solid rgba(230,205,152,.25); border-top-color:var(--gold-500); animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin-ic svg{animation:spin .8s linear infinite;}

/* ---------- Top bar ---------- */
.topbar{flex:0 0 auto; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; padding:0 8px 0 14px; background:var(--bg); border-bottom:1px solid var(--line); position:relative; z-index:20;}
.topbar .tb-side{display:flex; align-items:center; gap:4px; min-width:44px;}
.tb-title{font-size:17px; font-weight:700; color:var(--ink); text-align:center; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px;}
.tb-title small{display:block; font-size:11px; font-weight:500; color:var(--ink-faint); margin-top:1px;}
.iconbtn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--emerald-700);}
.iconbtn:active{background:var(--line);}
.iconbtn.ghost{width:34px;height:34px; border:1px solid var(--line); border-radius:50%; color:var(--ink-soft); flex:0 0 auto;}
.iconbtn.play{width:36px;height:36px; border-radius:50%; background:var(--emerald-700); color:#fff; flex:0 0 auto;}
.iconbtn.play svg{width:16px;height:16px;}
.iconbtn.play.active{background:var(--gold-600);}
.iconbtn svg{width:20px;height:20px;}

/* ---------- Content ---------- */
#content{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative; padding-bottom:18px;}
.fadein{animation:fadein .28s ease both;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.pad{padding:14px 16px;}
.section-title{font-size:15px; font-weight:700; color:var(--ink); margin:14px 16px 10px;}
.section-title span{font-weight:500; color:var(--ink-faint); font-size:12px;}

/* ---------- Hero (home) ---------- */
.hero{position:relative; margin:0 0 14px; padding:20px 18px 64px;
  background:linear-gradient(180deg, rgba(8,36,28,.55), rgba(8,36,28,.86) 70%, var(--bg) 100%),
    url('https://commons.wikimedia.org/wiki/Special:FilePath/The_Kaaba_during_Hajj.jpg') center 30%/cover no-repeat;
  color:#fff; border-radius:0 0 34px 34px; overflow:hidden;}
.hero-top{display:flex; align-items:center; justify-content:space-between;}
.brandmark{display:flex; align-items:center; gap:9px;}
.brandmark .b-badge{width:34px;height:34px;border-radius:10px; background:linear-gradient(145deg, var(--gold-300), var(--gold-600)); display:flex; align-items:center; justify-content:center; color:var(--emerald-900); font-weight:800; font-size:13px;}
.brandmark .b-text{font-weight:800; font-size:15px; letter-spacing:.02em;}
.brandmark .b-text small{display:block; font-weight:500; font-size:10.5px; color:var(--gold-300); letter-spacing:.14em;}
.hero-top-actions{display:flex; align-items:center; gap:6px;}
.hero-top-actions .iconbtn{background:rgba(255,255,255,.14); color:#fff; width:34px;height:34px;}
.hero-top-actions .iconbtn svg{width:17px;height:17px;}
.hero-mid{margin-top:22px; text-align:center;}
.hero-mid h1{font-family:var(--font-quran); font-size:34px; margin:0 0 4px; font-weight:400;}
.hero-mid p{margin:0; font-size:12.5px; color:var(--gold-100); opacity:.85;}
.hero-search{margin-top:18px; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(6px); border-radius:var(--r-pill); padding:10px 14px;}
.hero-search svg{width:17px;height:17px; color:#e8d8ab;}
.hero-search input{background:none; border:none; outline:none; color:#fff; font-size:13.5px; width:100%;}
.hero-search input::placeholder{color:rgba(255,255,255,.65);}

.continue-card{position:relative; margin:-46px 16px 6px; padding:16px 16px; background:linear-gradient(120deg, var(--gold-500), var(--gold-700)); border-radius:var(--r-lg); color:var(--emerald-900); box-shadow:var(--shadow-md); display:flex; align-items:center; gap:12px;}
.continue-card .cc-ic{width:44px;height:44px;border-radius:14px; background:rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.continue-card .cc-ic svg{width:22px;height:22px;}
.continue-card .cc-txt{flex:1; min-width:0;}
.continue-card .cc-txt b{display:block; font-size:14.5px; font-weight:800;}
.continue-card .cc-txt span{font-size:11.5px; opacity:.8;}
.continue-card .cc-go{width:34px;height:34px;border-radius:50%; background:rgba(255,255,255,.4); display:flex;align-items:center;justify-content:center; flex:0 0 auto;}
.continue-card .cc-go svg{width:16px;height:16px;}

.grid6{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;}
.feat{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:16px 8px 12px; text-align:center; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; gap:8px;}
.feat:active{transform:scale(.97);}
.feat .f-ic{width:44px;height:44px;border-radius:13px; background:linear-gradient(150deg, var(--emerald-500), var(--emerald-800)); display:flex; align-items:center; justify-content:center; color:var(--gold-300);}
.feat .f-ic svg{width:21px;height:21px;}
.feat b{font-size:12.5px; font-weight:700; color:var(--ink);}

/* ---------- Lists / rows ---------- */
.searchbar{display:flex; align-items:center; gap:8px; margin:0 16px 12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill); padding:10px 14px; box-shadow:var(--shadow-sm);}
.searchbar svg{width:16px;height:16px; color:var(--ink-faint);}
.searchbar input{border:none; outline:none; background:none; width:100%; font-size:13.5px; color:var(--ink);}

.list{margin:0 16px; display:flex; flex-direction:column; gap:9px;}
.row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 12px; box-shadow:var(--shadow-sm);}
.row:active{background:#FBF9F2;}
.row .r-num{flex:0 0 auto; width:38px;height:38px;border-radius:12px; background:var(--bg-deep); color:var(--emerald-700); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; border:1px solid var(--line);}
.row .r-num svg{width:18px;height:18px;}
.row .r-body{flex:1; min-width:0;}
.row .r-body b{display:block; font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .r-body span{font-size:11.5px; color:var(--ink-faint);}
.row .r-name-ar{font-family:var(--font-quran); font-size:16px;}
.row .r-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.row .r-actions svg{width:18px;height:18px;}

.empty, .err{margin:30px 16px; text-align:center; color:var(--ink-faint);}
.empty svg, .err svg{width:40px;height:40px; margin-bottom:10px; opacity:.5;}
.err button, .empty button{margin-top:12px; display:inline-flex; align-items:center; gap:6px; background:var(--emerald-700); color:#fff; padding:9px 18px; border-radius:var(--r-pill); font-size:12.5px; font-weight:700;}
.err button svg{width:14px;height:14px;}

.skel{margin:16px; display:flex; flex-direction:column; gap:9px;}
.skel-row{height:60px; border-radius:var(--r-md); background:linear-gradient(90deg, #ECE6D5 25%, #F5F1E6 37%, #ECE6D5 63%); background-size:400% 100%; animation:shine 1.4s ease infinite;}
@keyframes shine{0%{background-position:100% 0;}100%{background-position:0 0;}}

/* ---------- Reader ---------- */
.reader-toolbar{margin:10px 16px 4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.pill-btn{display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill); padding:8px 13px; font-size:12px; font-weight:700; color:var(--emerald-700); box-shadow:var(--shadow-sm);}
.pill-btn svg{width:14px;height:14px;}
.surah-hero{margin:10px 16px 14px; padding:22px 16px; text-align:center; border-radius:var(--r-lg); background:linear-gradient(160deg, var(--emerald-700), var(--emerald-900)); color:#fff; position:relative; overflow:hidden;}
.surah-hero::after{content:''; position:absolute; inset:0; background-image:repeating-linear-gradient(45deg, rgba(203,162,90,.06) 0 2px, transparent 2px 22px);}
.surah-hero h2{position:relative; font-family:var(--font-quran); font-weight:400; font-size:26px; margin:0 0 4px;}
.surah-hero p{position:relative; font-size:11.5px; color:#eadcb2; margin:0; opacity:.85;}
.ayat-wrap{margin:0 16px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 18px; box-shadow:var(--shadow-sm);}
.ayat-txt{font-family:var(--font-quran); font-size:var(--ayat-font-size); line-height:2.35; text-align:justify; color:var(--ink);}
.ayah-num{display:inline-flex; align-items:center; justify-content:center; width:28px;height:28px; margin:0 3px; vertical-align:middle; border:1.4px solid var(--gold-600); border-radius:50%; font-family:var(--font-ui); font-size:11px; font-weight:700; color:var(--gold-700);}
.translation-list{display:flex; flex-direction:column; gap:10px;}
.translation-list .t-row{border-bottom:1px solid var(--line); padding-bottom:8px;}
.translation-list .t-row b{color:var(--gold-700); font-size:11.5px;}
.translation-list .t-row p{margin:4px 0 0; font-size:13.5px; line-height:1.6;}

/* ---------- Mini player ---------- */
#miniplayer{flex:0 0 auto; display:none; align-items:center; gap:10px; padding:9px 14px; background:var(--emerald-800); color:#fff; border-top:1px solid rgba(255,255,255,.08);}
#miniplayer.show{display:flex;}
#miniplayer .mp-ic{width:34px;height:34px;border-radius:10px; background:rgba(255,255,255,.14); display:flex;align-items:center;justify-content:center; flex:0 0 auto;}
#miniplayer .mp-ic svg{width:16px;height:16px;}
#miniplayer .mp-body{flex:1; min-width:0;}
#miniplayer .mp-title{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#miniplayer .mp-sub{font-size:10px; color:#e7d7a8; opacity:.85;}
#miniplayer .mp-bar{height:3px; background:rgba(255,255,255,.2); border-radius:3px; margin-top:5px; overflow:hidden;}
#miniplayer .mp-bar i{display:block; height:100%; width:0%; background:#d8b46a;}
#miniplayer .mp-btn{width:32px;height:32px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
#miniplayer .mp-btn svg{width:15px;height:15px;}

/* ---------- Bottom nav ---------- */
#bottomnav{flex:0 0 auto; display:flex; align-items:stretch; justify-content:space-between; height:var(--nav-h); padding-bottom:var(--safe-b); background:var(--card); border-top:1px solid var(--line); position:relative; z-index:20;}
.navbtn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-faint); font-size:10px; font-weight:600;}
.navbtn svg{width:21px;height:21px;}
.navbtn.active{color:var(--emerald-700);}
.navbtn.active svg{color:var(--gold-600);}

/* ---------- Sheet ---------- */
.sheet-ov{position:absolute; inset:0; background:rgba(8,25,18,.45); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s ease;}
.sheet-ov.show{opacity:1; pointer-events:auto;}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:81; background:var(--bg); border-radius:24px 24px 0 0; box-shadow:0 -12px 30px rgba(0,0,0,.2); transform:translateY(105%); transition:transform .3s cubic-bezier(.32,.72,0,1); max-height:78%; display:flex; flex-direction:column;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:38px;height:4px; background:var(--line-strong); border-radius:3px; margin:10px auto 4px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 12px; border-bottom:1px solid var(--line);}
.sheet-head b{font-size:15px;}
.sheet-body{overflow-y:auto; padding:14px 16px 22px;}

.more-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.more-item{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:13px; box-shadow:var(--shadow-sm);}
.more-item .m-ic{width:38px;height:38px;border-radius:11px; background:var(--bg-deep); color:var(--emerald-700); display:flex; align-items:center;justify-content:center; flex:0 0 auto;}
.more-item .m-ic svg{width:18px;height:18px;}
.more-item b{font-size:12.5px;}

.reciter-pick-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 6px; border-bottom:1px solid var(--line);}
.reciter-pick-row:last-child{border-bottom:none;}
.reciter-pick-row b{font-size:13px;}
.reciter-pick-row span{font-size:11px; color:var(--ink-faint); display:block;}
.reciter-pick-row .chev-ic{flex:0 0 auto; color:var(--ink-faint);}
.reciter-pick-row .chev-ic svg{width:16px;height:16px;}

.toast{position:absolute; bottom:calc(var(--nav-h) + 14px); left:50%; transform:translateX(-50%) translateY(10px); background:var(--emerald-900); color:#fff; padding:9px 18px; border-radius:var(--r-pill); font-size:12px; font-weight:600; box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:.25s ease; z-index:200; white-space:nowrap; max-width:88%; overflow:hidden; text-overflow:ellipsis;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Settings ---------- */
.settings-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:14px; margin:0 16px 12px; box-shadow:var(--shadow-sm);}
.settings-row-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:10px;}
.swatches{display:flex; gap:12px; flex-wrap:wrap;}
.swatch{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-soft);}
.swatch span{width:34px;height:34px;border-radius:50%; background:var(--sw); border:2px solid transparent; box-shadow:var(--shadow-sm);}
.swatch.active span{border-color:var(--gold-600);}
.bg-thumb{background-size:cover; background-position:center; border:2px solid transparent;}
.swatch.active .bg-thumb{border-color:var(--gold-600);}
.bg-thumb-none{background:repeating-conic-gradient(var(--bg-deep) 0 25%, var(--card) 0 50%) 0 0/10px 10px;}
.bg-thumb-upload{display:flex; align-items:center; justify-content:center; background:var(--bg-deep); color:var(--emerald-700);}
.bg-thumb-upload svg{width:16px;height:16px;}
.lang-toggle{display:flex; gap:8px;}
.lang-btn{flex:1; padding:10px; text-align:center; border-radius:var(--r-md); background:var(--bg-deep); font-size:13px; font-weight:700; color:var(--ink-soft);}
.lang-btn.active{background:var(--emerald-700); color:#fff;}
.fontsize-row{display:flex; align-items:center; gap:10px;}
.fontsize-row .iconbtn{width:38px;height:38px; background:var(--bg-deep); font-weight:800; font-size:13px;}
.fontsize-preview{flex:1; text-align:center; font-family:var(--font-quran); color:var(--ink); padding:8px; background:var(--bg-deep); border-radius:var(--r-sm);}

/* ---------- Tools (prayer / qibla) ---------- */
.tool-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:16px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
.prayer-hero{position:relative; text-align:center; padding:22px 18px; margin:0 16px 16px; border-radius:var(--r-lg); overflow:hidden;
  background:linear-gradient(150deg, var(--emerald-600), var(--emerald-900)); color:#fff; box-shadow:var(--shadow-md);}
.prayer-hero::after{content:''; position:absolute; inset:0; background-image:repeating-linear-gradient(45deg, rgba(203,162,90,.07) 0 2px, transparent 2px 22px); pointer-events:none;}
.prayer-hero .ph-label{position:relative; font-size:11px; letter-spacing:.08em; color:var(--gold-300); text-transform:uppercase; opacity:.9;}
.prayer-hero .ph-count{position:relative; font-size:15px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
.prayer-hero .ph-name{position:relative; font-family:var(--font-quran); font-size:32px; margin-top:6px;}
.prayer-hero .ph-time{position:relative; font-size:22px; font-weight:800; color:var(--gold-300); margin-top:2px;}
.prayer-hero .ph-loc{position:relative; display:inline-flex; align-items:center; gap:5px; margin-top:14px; padding:6px 14px; border-radius:var(--r-pill); background:rgba(255,255,255,.14); font-size:11.5px;}
.prayer-hero .ph-loc svg{width:13px;height:13px;}
.prayer-hero .ph-hijri{position:relative; font-size:11px; color:var(--gold-100); opacity:.8; margin-top:8px;}
.prayer-pill-list{margin:0 16px; display:flex; flex-direction:column; gap:9px;}
.prayer-pill{display:flex; align-items:center; gap:12px; background:var(--card); border:1.4px solid var(--line); border-radius:var(--r-pill); padding:11px 18px; box-shadow:var(--shadow-sm);}
.prayer-pill .pp-ic{width:32px;height:32px;border-radius:50%; background:var(--bg-deep); color:var(--emerald-700); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.prayer-pill .pp-ic svg{width:16px;height:16px;}
.prayer-pill b{flex:1; font-size:13.5px; font-weight:700; color:var(--ink);}
.prayer-pill span{font-size:14px; font-weight:800; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.prayer-pill.next{border-color:var(--gold-500); background:linear-gradient(120deg, var(--gold-100), var(--card));}
.prayer-pill.next .pp-ic{background:var(--gold-500); color:var(--emerald-900);}
.prayer-pill.next span{color:var(--gold-700);}
.compass-wrap{display:flex; justify-content:center; margin:10px 0 14px; position:relative;}

.compass-needle{transition:transform .15s linear;}

.qibla-stat b{display:block; font-size:15px; color:var(--ink);}

.live-compass-btn svg{width:15px;height:15px;}
.live-compass-btn.active{background:var(--gold-600);}
.hadith-text{font-size:13.5px; line-height:1.8; color:var(--ink-soft);}
.hadith-item{border-top:1px solid var(--line); padding-top:10px; margin-top:10px;}
.hadith-item b{font-size:11.5px; color:var(--gold-700);}
.hadith-item p{margin:4px 0 0; font-size:14px; line-height:1.8;}

 }

async function getJSON(url, timeoutMs){
  if(STATE.cache[url]) return STATE.cache[url];
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs||12000);
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    STATE.cache[url] = data;
    return data;
  } finally { clearTimeout(timer); }
}

/* =====================================================================
   MASTER SURAH LIST
   ===================================================================== */
let MASTER_SUWAR = null;
async function loadMasterSuwar(){
  if(MASTER_SUWAR) return MASTER_SUWAR;
  const [cloudRes, mp3Res] = await Promise.allSettled([ getJSON(QURAN_LIST), getJSON(API.suwar()) ]);
  let cloud = cloudRes.status==='fulfilled' ? (cloudRes.value.data||[]) : [];
  let mp3 = mp3Res.status==='fulfilled' ? (mp3Res.value.suwar||mp3Res.value.surah||[]) : [];
  const byId = {};
  cloud.forEach(s=>{ byId[s.number] = { id:s.number, nameAr:s.name, nameEn:s.englishName, ayahCount:s.numberOfAyahs, type:s.revelationType }; });
  mp3.forEach(s=>{
    const id=s.id;
    if(!byId[id]) byId[id] = { id, nameAr:(s.name||'').trim(), nameEn:(s.name||'').trim(), ayahCount:null, type:null };
    if(byId[id].type===null || byId[id].type===undefined) byId[id].type = (s.makkia===1||s.makkia==='1') ? 'Meccan' : 'Medinan';
  });
  const arr = Object.values(byId).sort((a,b)=>a.id-b.id);
  MASTER_SUWAR = arr.length ? arr : null;
  return MASTER_SUWAR;
}
function surahName(id){
  const s = (MASTER_SUWAR||[]).find(x=>x.id===Number(id));
  if(!s) return (STATE.settings.lang==='en'?'Surah ':'سورة ')+nd(id);
  return STATE.settings.lang==='en' ? (s.nameEn||s.nameAr).trim() : s.nameAr;
}

const audioEl = new Audio();
audioEl.preload = 'none';
function playTrack(url, title, sub){
  const mp = $('#miniplayer');
  if(STATE.playing && STATE.playing.url===url){
    if(audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause();
  } else {
    audioEl.src = url;
    audioEl.play().catch(()=>showToast(t('playErr')));
    STATE.playing = {url, title, sub};
    mp.classList.add('show');
    $('#mpTitle').textContent = title || '—';
    $('#mpSub').textContent = sub || '—';
  }
  syncPlayButtons(); updateMiniIcon();
}
function stopTrack(){
  audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load();
  STATE.playing = null; $('#miniplayer').classList.remove('show');
  syncPlayButtons();
}
function updateMiniIcon(){ $('#mpIcon').innerHTML = ICON.wave; $('#mpToggle').innerHTML = audioEl.paused ? ICON.play : ICON.pause; }
function syncPlayButtons(){
  document.querySelectorAll('[data-track-url]').forEach(btn=>{
    const active = STATE.playing && STATE.playing.url===btn.getAttribute('data-track-url') && !audioEl.paused;
    btn.classList.toggle('active', !!active);
    btn.innerHTML = active ? ICON.pause : ICON.play;
  });
}
audioEl.addEventListener('play', ()=>{ syncPlayButtons(); updateMiniIcon(); });
audioEl.addEventListener('pause', ()=>{ syncPlayButtons(); updateMiniIcon(); });
audioEl.addEventListener('ended', ()=>{ syncPlayButtons(); updateMiniIcon(); });
audioEl.addEventListener('timeupdate', ()=>{ if(audioEl.duration){ $('#mpProgress').style.width = ((audioEl.currentTime/audioEl.duration)*100)+'%'; } });
$('#mpToggle').addEventListener('click', ()=>{ if(!STATE.playing) return; if(audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause(); });

    <div class="ayat-wrap" id="ayatWrap">${loadingBlock()}</div>

  `);
  $('#pickReciterBtn').addEventListener('click', ()=>openReciterQuickPick(id));
  $('#playSurahBtn').addEventListener('click', ()=>playSurahAudio(id, surahName(id)));
  try{
    const data = await getJSON(QURAN_SURAH(id));
    if(myEpoch!==STATE.epoch) return;
    const ayahs = (data.data && data.data.ayahs) || [];
    if(!ayahs.length) throw new Error('empty');
    const txt = ayahs.map(a=>`${a.text}<span class="ayah-num">${toArabicDigits(a.numberInSurah)}</span>`).join(' ');
    $set('#ayatWrap', `<div class="ayat-txt">${txt}</div>`);
    if(STATE.settings.lang==='en'){
      try{
        const en = await getJSON(QURAN_SURAH_EN(id));
        if(myEpoch!==STATE.epoch) return;
        const enAyahs = (en.data && en.data.ayahs) || [];
        if(enAyahs.length){
          $set('#translationWrap', `<div class="ayat-wrap"><div class="translation-list">${enAyahs.map(a=>`<div class="t-row"><b>${a.numberInSurah}</b><p>${a.text}</p></div>`).join('')}</div></div>`);
        }
      }catch(e){}
    }
  }catch(e){ if(myEpoch!==STATE.epoch) return; $set('#ayatWrap', errBlock(t('loadErrText'), ()=>renderReader(id))); }
}

async function playSurahAudio(surahId, name){
  if(STATE.selectedMoshaf && STATE.selectedMoshaf.surahList.has(surahId)){
    const url = STATE.selectedMoshaf.server + pad3(surahId) + '.mp3';
    playTrack(url, (STATE.settings.lang==='ar'?'سورة ':'Surah ')+name, STATE.selectedMoshaf.reciterName+' — '+STATE.selectedMoshaf.moshafName);
    return;
  }
  showToast(t('pleasePickReciter'));
  openReciterQuickPick(surahId, name);
}

async function openReciterQuickPick(surahId, name){
  const myEpoch = STATE.epoch;

  try{
    const url = surahId ? `${API.reciters()}&sura=${surahId}` : API.reciters();
    const data = await getJSON(url);
    if(myEpoch!==STATE.epoch || mySheetEpoch!==STATE.sheetEpoch) return;
    const reciters = data.reciters || data.reads || [];
    if(!reciters.length){ $('#sheetBody').innerHTML = emptyBlock(t('noReciters')); return; }

      const m = r.moshaf[0];
      return `<div class="reciter-pick-row" data-i="${i}"><div><b>${r.name}</b><span>${m?m.name:''}</span></div><span class="chev-ic">${ICON.chev}</span></div>`;
    }).join('');
    $('#sheetBody').innerHTML = rows;
    $('#sheetBody').querySelectorAll('[data-i]').forEach(row=>{
      row.addEventListener('click', ()=>chooseReciterMoshaf(reciters[Number(row.getAttribute('data-i'))], surahId, name));
    });
  }catch(e){
    if(myEpoch!==STATE.epoch || mySheetEpoch!==STATE.sheetEpoch) return;

function chooseReciterMoshaf(reciter, surahId, name){
  const moshafs = reciter.moshaf||[];
  if(moshafs.length<=1){
    setSelectedMoshaf(reciter.name, moshafs[0]); closeSheet();
    if(surahId) playSurahAudio(surahId, name || surahName(surahId)); else render();
    return;
  }
  $('#sheetTitle').textContent = reciter.name;
  $('#sheetBody').innerHTML = moshafs.map((m,i)=>`<div class="reciter-pick-row" data-mi="${i}"><div><b>${m.name}</b><span>${(m.surah_total||'')+ (STATE.settings.lang==='ar'?' سورة':' surahs')}</span></div><span class="chev-ic">${ICON.chev}</span></div>`).join('');

    row.addEventListener('click', ()=>{

function setSelectedMoshaf(reciterName, m){

async function renderMoshaf(){
  const myEpoch = STATE.epoch;
  setContent(STATE._reciters && STATE._reciters.length ? '' : loadingBlock());
  try{
    const reciters = (STATE._reciters && STATE._reciters.length) ? STATE._reciters : ((await getJSON(API.reciters())).reciters || []);
    if(myEpoch!==STATE.epoch) return;
    STATE._reciters = reciters;
    const map = new Map();
    reciters.forEach(r=>(r.moshaf||[]).forEach(m=>{
      const key = m.moshaf_type+'|'+m.name;
      if(!map.has(key)) map.set(key, {moshaf_type:m.moshaf_type, name:m.name, count:0});
      map.get(key).count++;
    }));
    const list = Array.from(map.values()).sort((a,b)=>b.count-a.count);
    if(!list.length){ setContent(emptyBlock(t('noMoshafData'))); return; }
    setContent(`<div class="list">${list.map((m,i)=>`
      <div class="row" data-mt="${i}">

        <div class="r-body"><b>${m.name}</b><span>${nd(m.count)} ${STATE.settings.lang==='ar'?'قارئ':'reciter(s)'}</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-mt]').forEach(row=>{
      row.addEventListener('click', ()=>openMoshafTypeResults(list[Number(row.getAttribute('data-mt'))]));
    });
  }catch(e){ if(myEpoch!==STATE.epoch) return; setContent(errBlock(t('loadErrMoshaf'), renderMoshaf)); }
}

    const reciters = (STATE._reciters && STATE._reciters.length) ? STATE._reciters : ((await getJSON(API.reciters())).reciters||[]);

async function renderTafsirSurahs(params){
  const myEpoch = STATE.epoch;
  await loadMasterSuwar().catch(()=>{});
  if(myEpoch!==STATE.epoch) return;
  const list = MASTER_SUWAR||[];
  if(!list.length){ setContent(errBlock(t('loadErrSurahs'), ()=>renderTafsirSurahs(params))); return; }
  setContent(`<div class="list">${list.map(s=>`
    <div class="row">
      <div class="r-num">${nd(s.id)}</div>
      <div class="r-body"><b class="${STATE.settings.lang==='ar'?'r-name-ar':''}">${surahName(s.id)}</b><span>${params.tafsirName}</span></div>
      <div class="r-actions"><button class="iconbtn play" data-tsid="${s.id}">${ICON.play}</button></div>
    </div>`).join('')}</div>`);
  $('#content').querySelectorAll('[data-tsid]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.loading==='1') return;
      const sid = btn.getAttribute('data-tsid');
      const existing = btn.getAttribute('data-track-url');
      if(existing){ playTrack(existing, (STATE.settings.lang==='ar'?'سورة ':'Surah ')+surahName(sid), params.tafsirName); return; }
      btn.dataset.loading = '1';
      btn.classList.add('spin-ic'); btn.innerHTML = ICON.refresh;
      const clickEpoch = STATE.epoch;
      try{
        const sep = params.tafsirUrl.includes('?') ? '&' : '?';
        const data = await getJSON(`${params.tafsirUrl}${sep}sura=${sid}`);
        if(clickEpoch!==STATE.epoch) return;
        const soraObj = (data.tafasir && data.tafasir.sora) || {};
        const raw = soraObj[sid] || soraObj[String(sid)];
        const item = Array.isArray(raw) ? raw[0] : raw;
        const url = item && item.url;
        btn.dataset.loading = '0'; btn.classList.remove('spin-ic');
        if(!url){ btn.innerHTML = ICON.play; showToast(t('tafsirUnavailable')); return; }
        btn.setAttribute('data-track-url', url);
        btn.innerHTML = ICON.play;
        playTrack(url, (STATE.settings.lang==='ar'?'سورة ':'Surah ')+surahName(sid), params.tafsirName);
      }catch(e){
        btn.dataset.loading = '0';
        if(clickEpoch!==STATE.epoch) return;
        btn.classList.remove('spin-ic'); btn.innerHTML = ICON.play; showToast(t('tafsirFetchErr'));
      }
    });
  });
}

   ===================================================================== */
function renderFavorites(){
  const f = STATE.favorites;
  const any = f.surahs.length||f.reciters.length||f.radios.length;
  if(!any){ setContent(emptyBlock(t('emptyFavorites'))); return; }
  const sections = [ ['surahs', t('favSurahsTitle')], ['reciters', t('favRecitersTitle')], ['radios', t('favRadiosTitle')] ];
  let html='';
  sections.forEach(([key, title])=>{
    const items = f[key]; if(!items.length) return;
    html += `<div class="section-title">${title}</div><div class="list" data-favtype="${key}">`;
    items.slice().sort((a,b)=>b.at-a.at).forEach(it=>{
      html += `<div class="row" data-favid="${it.id}">
        <div class="r-num">${key==='surahs'?nd(it.id):(it.name||'★').trim()[0]}</div>
        <div class="r-body"><b class="${key==='surahs'&&STATE.settings.lang==='ar'?'r-name-ar':''}">${it.name}</b><span>${key==='radios'?t('liveStream'):''}</span></div>
        <div class="r-actions"><button class="iconbtn ghost" data-favremove="${key}|${it.id}">${ICON.close}</button></div>
      </div>`;
    });
    html += `</div>`;
  });
  setContent(html);
  $('#content').querySelectorAll('[data-favtype]').forEach(listEl=>{
    const type = listEl.getAttribute('data-favtype');
    listEl.querySelectorAll('[data-favid]').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('[data-favremove]')) return;
        const id = row.getAttribute('data-favid');
        const item = STATE.favorites[type].find(x=>String(x.id)===id);
        if(!item) return;
        if(type==='surahs') nav('reader', {id:item.id, name:item.name});
        else if(type==='reciters') openReciterMoshafPage(item);
        else if(type==='radios') playTrack(item.url, item.name, t('liveStream'));
      });
    });
  });
  $('#content').querySelectorAll('[data-favremove]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); const [type,id]=b.getAttribute('data-favremove').split('|'); toggleFavorite(type, {id:Number(id)}); renderFavorites(); });
  });
}

        </div>
        <input type="file" id="bgFileInput" accept="image/*" style="display:none">
      </div>
      <div class="settings-card">
        <div class="settings-row-label">${t('settingsFontSize')}</div>
        <div class="fontsize-row">
          <button class="iconbtn ghost" id="fsDown">A-</button>
          <div class="fontsize-preview" style="font-size:${18*s.fontScale}px">${t('fontPreview')}</div>
          <button class="iconbtn ghost" id="fsUp">A+</button>
        </div>
      </div>
    </div>
  `);
  $('#content').querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click', ()=>{ applyTheme(b.getAttribute('data-theme')); renderSettings(); }));
  $('#content').querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click', ()=>setLang(b.getAttribute('data-lang'))));
  $('#content').querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click', ()=>{
    const choice = b.getAttribute('data-bg');
    if(choice==='custom-trigger'){ $('#bgFileInput').click(); return; }
    applyBackground(choice); renderSettings();
  }));
  $('#bgFileInput').addEventListener('change', (e)=>handleCustomBgFile(e.target.files[0]));
  $('#fsDown').addEventListener('click', ()=>setFontScale(Math.max(.8, STATE.settings.fontScale-.1)));
  $('#fsUp').addEventListener('click', ()=>setFontScale(Math.min(1.6, STATE.settings.fontScale+.1)));
}

/* =====================================================================
   LOCATION HELPER — geolocation first, silent IP-based fallback second.
   Never asks the user to type anything; only shown if BOTH fail.
   ===================================================================== */
async function getApproxLocation(){
  const geo = await new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    let done=false;
    const timer=setTimeout(()=>{ if(!done){ done=true; resolve(null); } }, 6000);
    try{
      navigator.geolocation.getCurrentPosition(
        pos=>{ if(done) return; done=true; clearTimeout(timer); resolve({latitude:pos.coords.latitude, longitude:pos.coords.longitude, timezone:Intl.DateTimeFormat().resolvedOptions().timeZone}); },
        ()=>{ if(done) return; done=true; clearTimeout(timer); resolve(null); },
        {timeout:5500, maximumAge:600000}
      );
    }catch(e){ if(!done){ done=true; clearTimeout(timer); resolve(null); } }
  });
  if(geo) return geo;
  try{
    const ip = await getJSON('https://ipwho.is/', 6000);
    if(ip && ip.success!==false && ip.latitude!==undefined){
      return { latitude:ip.latitude, longitude:ip.longitude, timezone:(ip.timezone&&ip.timezone.id)||Intl.DateTimeFormat().resolvedOptions().timeZone };
    }
  }catch(e){}
  return null;
}

/* =====================================================================
   PRAYER TIMES — fully automatic, no manual input required.
   ===================================================================== */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function clearPrayerTimer(){ if(STATE._prayerTimer){ clearInterval(STATE._prayerTimer); STATE._prayerTimer=null; } }
async function renderPrayer(){
  const myEpoch = STATE.epoch;
  clearPrayerTimer();
  setContent(`<div class="prayer-hero"><div class="ph-label">${t('prayerLocating')}</div></div><div id="prayerResult">${loadingBlock()}</div>`);
  const loc = await getApproxLocation();
  if(myEpoch!==STATE.epoch) return;
  if(!loc){ $set('#prayerResult', errBlock(t('prayerLoadErr'), renderPrayer)); return; }
  fetchPrayerTimes(loc, myEpoch);
}
async function fetchPrayerTimes(loc, myEpoch){
  if(myEpoch===undefined) myEpoch = STATE.epoch;
  $set('#prayerResult', loadingBlock());
  try{
    const qs = new URLSearchParams();
    qs.set('latitude', loc.latitude); qs.set('longitude', loc.longitude);
    if(loc.timezone) qs.set('timezone', loc.timezone);
    const data = await getJSON(`${ISLAMIC_BASE}/timings/today?${qs.toString()}`, 10000);
    if(myEpoch!==STATE.epoch) return;
    const d = data.data; if(!d) throw new Error('no data');
    const hijri = d.date && d.date.hijri;
    const cityName = (d.meta && d.meta.city && d.meta.city.name) || loc.city || '';
    const rows = [['prayerFajr',ICON.clock,d.timings.Fajr],['prayerSunrise',ICON.clock,d.timings.Sunrise],['prayerDhuhr',ICON.clock,d.timings.Dhuhr],['prayerAsr',ICON.clock,d.timings.Asr],['prayerMaghrib',ICON.clock,d.timings.Maghrib],['prayerIsha',ICON.clock,d.timings.Isha]].filter(r=>r[2]);
    STATE._prayerRows = rows;
    STATE._prayerHijri = hijri; STATE._prayerCity = cityName;
    renderPrayerTick();
    clearPrayerTimer();
    STATE._prayerTimer = setInterval(()=>{ if(myEpoch!==STATE.epoch){ clearPrayerTimer(); return; } renderPrayerTick(); }, 1000);
  }catch(e){ if(myEpoch!==STATE.epoch) return; $set('#prayerResult', errBlock(t('prayerLoadErr'), ()=>fetchPrayerTimes(loc))); }
}
function renderPrayerTick(){
  const rows = STATE._prayerRows; if(!rows) return;
  const now = new Date();
  let nextKey=null, nextDate=null;
  for(const [k,,v] of rows){
    const [h,m]=String(v).split(':').map(Number);
    const dt=new Date(); dt.setHours(h,m,0,0);
    if(dt>now){ nextKey=k; nextDate=dt; break; }
  }
    if(!nextDate){ const [h,m]=String(rows[0][2]).split(':').map(Number); nextDate=new Date(); nextDate.setDate(nextDate.getDate()+1); nextDate.setHours(h,m,0,0); nextKey=rows[0][0]; }
  const diff = Math.max(0, nextDate - now);
  const hh = String(Math.floor(diff/3600000)).padStart(2,'0');
  const mm = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const ss = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  const hijri = STATE._prayerHijri, city = STATE._prayerCity;
  const heroHtml = `
    <div class="prayer-hero">
      <div class="ph-label">${t('prayerNext')}</div>
      <div class="ph-count">${nd(hh)}:${nd(mm)}:${nd(ss)}</div>
      <div class="ph-name">${t(nextKey)}</div>
      <div class="ph-time">${nd(rows.find(r=>r[0]===nextKey)[2])}</div>
      ${city?`<div class="ph-loc">${ICON.compass}<span>${city}</span></div>`:''}
      ${hijri?`<div class="ph-hijri">${nd(hijri.day)} ${hijri.month&&hijri.month.en} ${nd(hijri.year)} ${STATE.settings.lang==='ar'?'هـ':'AH'}</div>`:''}
    </div>
    <div class="prayer-pill-list">${rows.map(([k,ic,v])=>`
      <div class="prayer-pill ${k===nextKey?'next':''}"><span class="pp-ic">${ic}</span><b>${t(k)}</b><span>${nd(v)}</span></div>`).join('')}
    </div>`;
  if(!$set('#prayerResult', heroHtml)) clearPrayerTimer();
}

/* =====================================================================
   QIBLA — fully automatic, with an optional live device-compass mode.
   ===================================================================== */
const KAABA = {lat:21.4225, lon:39.8262};
function stopLiveCompass(){
  if(STATE._compassHandler){
    window.removeEventListener('deviceorientationabsolute', STATE._compassHandler);
    window.removeEventListener('deviceorientation', STATE._compassHandler);
    STATE._compassHandler = null;
  }
}
async function renderQibla(){
  const myEpoch = STATE.epoch;
  stopLiveCompass();
  setContent(`<div class="prayer-hero"><div class="ph-label">${t('prayerLocating')}</div></div><div id="qiblaResult">${loadingBlock()}</div>`);
  const loc = await getApproxLocation();
  if(myEpoch!==STATE.epoch) return;
  if(!loc){ $set('#content', errBlock(t('qiblaErr'), renderQibla)); return; }
  setContent(`<div id="qiblaResult">${loadingBlock()}</div>`);
  fetchQibla(loc.latitude, loc.longitude, myEpoch);
}
async function fetchQibla(lat, lon, myEpoch){
  if(myEpoch===undefined) myEpoch = STATE.epoch;
  $set('#qiblaResult', loadingBlock());
  try{
    const data = await getJSON(`${ISLAMIC_BASE}/qibla/${lat}/${lon}`, 10000);
    if(myEpoch!==STATE.epoch) return;
    const d = data.data; if(!d) throw new Error('no data');
    if(d.direction===null || d.direction===undefined){ $set('#qiblaResult', emptyBlock(t('qiblaAtKaaba'))); return; }
    const deg = Math.round(d.direction*10)/10;
    const distKm = Math.round(haversineKm(lat,lon,KAABA.lat,KAABA.lon));
    STATE._qiblaDeg = deg;
    $set('#qiblaResult', `
      <div class="compass-wrap"><svg viewBox="0 0 200 200" class="compass-svg" id="qiblaCompassSvg">
        <circle cx="100" cy="100" r="92" fill="none" stroke="var(--line-strong)" stroke-width="2"/>
        <circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="1"/>
        <text x="100" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink-faint)">N</text>
        <text x="100" y="188" text-anchor="middle" font-size="13" fill="var(--ink-faint)">S</text>
        <text x="14" y="105" text-anchor="middle" font-size="13" fill="var(--ink-faint)">W</text>
        <text x="186" y="105" text-anchor="middle" font-size="13" fill="var(--ink-faint)">E</text>
        <g id="qiblaNeedle" class="compass-needle" transform="rotate(${deg} 100 100)">
          <line x1="100" y1="100" x2="100" y2="26" stroke="var(--gold-600)" stroke-width="5" stroke-linecap="round"/>
          <polygon points="100,14 91,34 109,34" fill="var(--gold-600)"/>
          <circle cx="100" cy="100" r="7" fill="var(--emerald-700)"/>
        </g>
      </svg></div>
      <div class="qibla-result"><b>${nd(deg)}°</b><span>${t('qiblaResult')}</span></div>
      <div class="qibla-stats">
        <div class="qibla-stat"><b>${nd(deg)}°</b><span>${STATE.settings.lang==='ar'?'الاتجاه':'Bearing'}</span></div>
        <div class="qibla-stat"><b>${nd(distKm)} ${STATE.settings.lang==='ar'?'كم':'km'}</b><span>${STATE.settings.lang==='ar'?'المسافة إلى الكعبة':'Distance to Kaaba'}</span></div>
      </div>
      <button class="live-compass-btn" id="liveCompassBtn">${ICON.compass}<span>${STATE.settings.lang==='ar'?'تفعيل البوصلة المباشرة':'Enable live compass'}</span></button>
    `);
    const btn = $('#liveCompassBtn');
    if(btn) btn.addEventListener('click', ()=>toggleLiveCompass(btn));
  }catch(e){ if(myEpoch!==STATE.epoch) return; $set('#qiblaResult', errBlock(t('qiblaErr'), ()=>fetchQibla(lat,lon))); }
}
async function toggleLiveCompass(btn){
  if(STATE._compassHandler){ stopLiveCompass(); btn.classList.remove('active'); btn.querySelector('span').textContent = STATE.settings.lang==='ar'?'تفعيل البوصلة المباشرة':'Enable live compass'; return; }
  const start = ()=>{
    const handler = (e)=>{
      let heading = null;
      if(typeof e.webkitCompassHeading === 'number') heading = e.webkitCompassHeading;
      else if(typeof e.alpha === 'number') heading = 360 - e.alpha;
      if(heading===null) return;
      const svg = $('#qiblaCompassSvg'); const needle = $('#qiblaNeedle');
      if(!svg || !needle){ stopLiveCompass(); return; }
      svg.style.transform = `rotate(${-heading}deg)`;
      needle.setAttribute('transform', `rotate(${STATE._qiblaDeg} 100 100)`);
    };
    STATE._compassHandler = handler;
    window.addEventListener('deviceorientationabsolute', handler);
    window.addEventListener('deviceorientation', handler);
    btn.classList.add('active'); btn.querySelector('span').textContent = STATE.settings.lang==='ar'?'إيقاف البوصلة المباشرة':'Disable live compass';
  };
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    try{ const res = await DeviceOrientationEvent.requestPermission(); if(res==='granted') start(); else showToast(t('qiblaErr')); }
    catch(e){ showToast(t('qiblaErr')); }
  } else { start(); }
}

/* =====================================================================
   HADITH — collections → books → chapters → hadiths (client-filtered
   by chapterId, since the API lists hadiths per BOOK, not per chapter).
   ===================================================================== */
async function renderHadith(){
  const myEpoch = STATE.epoch;
  setContent(STATE._hadithCollections ? '' : loadingBlock());
  try{
    const list = STATE._hadithCollections || (await getJSON(`${ISLAMIC_BASE}/hadith/collections`, 10000)).data || [];
    if(myEpoch!==STATE.epoch) return;
    STATE._hadithCollections = list;
    if(!list.length){ setContent(emptyBlock(t('hadithNoData'))); return; }
    setContent(`<div class="list">${list.map((c,i)=>`
      <div class="row" data-hc="${i}">
        <div class="r-num">${ICON.book}</div>
        <div class="r-body"><b>${(STATE.settings.lang==='ar'?(c.name&&c.name.ar):(c.name&&c.name.en))||c.slug}</b><span>${c.totalAvailable?(nd(c.totalAvailable)+' '+t('hadithTotal')):''}</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-hc]').forEach(row=>{
      const c = list[Number(row.getAttribute('data-hc'))];
      const nm = (STATE.settings.lang==='ar'?(c.name&&c.name.ar):(c.name&&c.name.en))||c.slug;
      row.addEventListener('click', ()=>nav('hadithBooks', {slug:c.slug, name:nm, hasBooks:c.hasBooks!==false}));
    });
  }catch(e){ if(myEpoch!==STATE.epoch) return; setContent(errBlock(t('hadithLoadErr'), renderHadith)); }
}
async function renderHadithBooks(params){
  const myEpoch = STATE.epoch;
  setContent(loadingBlock());
  try{
    const data = await getJSON(`${ISLAMIC_BASE}/hadith/collections/${params.slug}/books`, 10000);
    if(myEpoch!==STATE.epoch) return;
    const list = data.data||[];
    if(!list.length){ setContent(emptyBlock(t('hadithNoData'))); return; }
    setContent(`<div class="list">${list.map((b,i)=>`
      <div class="row" data-hb="${i}">
        <div class="r-num">${nd(b.bookNumber)}</div>
        <div class="r-body"><b>${(STATE.settings.lang==='ar'?(b.name&&b.name.ar):(b.name&&b.name.en))||''}</b><span>${b.hadithCount?(nd(b.hadithCount)+' '+t('hadithTotal')):''}</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-hb]').forEach(row=>{
      const b = list[Number(row.getAttribute('data-hb'))];
      const bn = (STATE.settings.lang==='ar'?(b.name&&b.name.ar):(b.name&&b.name.en))||'';
      row.addEventListener('click', ()=>nav('hadithChapters', {slug:params.slug, bookNumber:b.bookNumber, bookName:bn, collectionName:params.name}));
    });
  }catch(e){ if(myEpoch!==STATE.epoch) return; setContent(errBlock(t('hadithLoadErr'), ()=>renderHadithBooks(params))); }
}
async function renderHadithChapters(params){
  const myEpoch = STATE.epoch;
  setContent(loadingBlock());
  try{
    const data = await getJSON(`${ISLAMIC_BASE}/hadith/collections/${params.slug}/books/${params.bookNumber}/chapters`, 10000);
    if(myEpoch!==STATE.epoch) return;
    const list = data.data||[];
    if(!list.length){ setContent(emptyBlock(t('hadithNoData'))); return; }
    setContent(`<div class="list">${list.map((c,i)=>`
      <div class="row" data-hch="${i}">
        <div class="r-num">${ICON.bubble}</div>
        <div class="r-body"><b>${(STATE.settings.lang==='ar'?(c.title&&c.title.ar):(c.title&&c.title.en))||''}</b><span>${t('hadithChapters')} ${nd(c.chapterNumber)}</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-hch]').forEach(row=>{
      const c = list[Number(row.getAttribute('data-hch'))];
      row.addEventListener('click', ()=>nav('hadithChapterDetail', {chapter:c, slug:params.slug, bookNumber:params.bookNumber, collectionName:params.collectionName, bookName:params.bookName}));
    });
  }catch(e){ if(myEpoch!==STATE.epoch) return; setContent(errBlock(t('hadithLoadErr'), ()=>renderHadithChapters(params))); }
}
async function renderHadithChapterDetail(params){
  const myEpoch = STATE.epoch;
  const c = params.chapter;
  const title = (STATE.settings.lang==='ar'?(c.title&&c.title.ar):(c.title&&c.title.en))||'';
  const intro = STATE.settings.lang==='ar'?(c.intro&&c.intro.ar):(c.intro&&c.intro.en);
  const ending = STATE.settings.lang==='ar'?(c.ending&&c.ending.ar):(c.ending&&c.ending.en);
  setContent(`
    <div class="ayat-wrap" style="margin-top:14px;">
      <h3 style="margin:0 0 10px;font-size:16px;">${title}</h3>
      ${intro? `<div class="hadith-text">${intro}</div>`:''}
      <div id="hadithDeep">${loadingBlock()}</div>
      ${ending? `<div class="hadith-text" style="margin-top:10px;opacity:.85;">${ending}</div>`:''}
    </div>
  `);
  try{
    // The API lists hadiths per BOOK (not per chapter), so page through the
    // book's hadiths and keep only the ones whose chapterId matches this chapter.
    const matched = [];
    let offset = 0; const limit = 200; let total = Infinity; let guard = 0;
    while(offset < total && guard < 15){
      const data = await getJSON(`${ISLAMIC_BASE}/hadith/collections/${params.slug}/books/${params.bookNumber}/hadiths?limit=${limit}&offset=${offset}`, 12000);
      if(myEpoch!==STATE.epoch) return;
      const d = data.data || {};
      total = typeof d.total==='number' ? d.total : (offset + (d.hadiths||[]).length);
      const hadiths = d.hadiths || [];
      hadiths.forEach(h=>{ if(String(h.chapterId)===String(c.chapterId)) matched.push(h); });
      if(!hadiths.length) break;
      offset += limit; guard++;
    }
    if(myEpoch!==STATE.epoch) return;
    if(matched.length){
      $('#hadithDeep').innerHTML = matched.map(h=>{
        const body = STATE.settings.lang==='ar' ? h.ar : h.en;
        const txt = (body && (body.text || body.body)) || '';
        const num = h.hadithNumber || '';
        return `<div class="hadith-item">${num?`<b>${t('hadithTotal')} ${nd(num)}</b>`:''}<p>${txt}</p></div>`;
      }).join('');
    } else {
      $('#hadithDeep').innerHTML = intro ? '' : emptyBlock(t('hadithNoData'));
    }
  }catch(e){ if(myEpoch!==STATE.epoch) return; $('#hadithDeep').innerHTML = intro ? '' : emptyBlock(t('hadithNoData')); }
}

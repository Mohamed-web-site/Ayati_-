<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>9ORAN — القرآن الكريم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap');

:root{
  --bg:#F5F1E6;
  --bg-deep:#EEE7D5;
  --ink:#16241D;
  --ink-soft:#516158;
  --ink-faint:#8B978F;
  --emerald-900:#08241C;
  --emerald-800:#0C3327;
  --emerald-700:#124334;
  --emerald-600:#195A44;
  --emerald-500:#217056;
  --emerald-400:#2E8A6A;
  --gold-700:#9C7530;
  --gold-600:#B78A3F;
  --gold-500:#CBA25A;
  --gold-300:#E6CD98;
  --gold-100:#F4E9CE;
  --card:#FFFFFF;
  --line:rgba(18,44,33,.10);
  --line-strong:rgba(18,44,33,.18);
  --shadow-sm:0 2px 10px rgba(15,35,27,.06);
  --shadow-md:0 10px 28px rgba(12,30,23,.12);
  --shadow-lg:0 24px 60px rgba(8,25,18,.28);
  --r-lg:24px;
  --r-md:16px;
  --r-sm:11px;
  --r-pill:999px;
  --font-ui:'Cairo',system-ui,sans-serif;
  --font-quran:'Amiri Quran','Amiri',serif;
  --topbar-h:60px;
  --nav-h:66px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-ui);
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 15% -10%, #F9F4E6 0%, transparent 60%),
    radial-gradient(1200px 800px at 85% 110%, #E7E0C9 0%, transparent 55%),
    var(--emerald-900);
  min-height:100%;
  overflow-x:hidden;
}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0;}
input{font-family:inherit; color:inherit;}
::-webkit-scrollbar{width:0;height:0;}
*{scrollbar-width:none;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}

/* ---------- Stage / device frame ---------- */
.stage{
  min-height:100vh;
  display:flex;
  align-items:stretch;
  justify-content:center;
  background:var(--emerald-900);
}
.device{
  position:relative;
  width:100%;
  max-width:560px;
  height:100vh;
  background:var(--bg);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.25);
}

/* ---------- Splash ---------- */
#splash{
  position:absolute; inset:0; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:
    linear-gradient(180deg, var(--emerald-900) 0%, var(--emerald-800) 55%, var(--emerald-700) 100%);
  transition:opacity .6s ease, visibility .6s ease;
}
#splash::before{
  content:'';
  position:absolute; inset:0;
  background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/The_Kaaba_during_Hajj.jpg');
  background-size:cover; background-position:center 40%;
  opacity:.16; mix-blend-mode:luminosity;
}
#splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
.splash-mark{
  position:relative; z-index:1;
  font-size:15px; letter-spacing:.35em; color:var(--gold-300); font-weight:600;
}
.splash-title{
  position:relative; z-index:1;
  font-family:var(--font-quran);
  font-size:44px; color:#fff; text-align:center;
}
.splash-ring{
  position:relative; z-index:1;
  width:46px; height:46px; border-radius:50%;
  border:2.5px solid rgba(230,205,152,.25); border-top-color:var(--gold-500);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Top bar ---------- */
.topbar{
  flex:0 0 auto;
  height:var(--topbar-h);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 8px 0 14px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  position:relative; z-index:20;
}
.topbar .tb-side{display:flex; align-items:center; gap:4px; min-width:44px;}
.tb-title{font-size:17px; font-weight:700; color:var(--ink); text-align:center; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px;}
.tb-title small{display:block; font-size:11px; font-weight:500; color:var(--ink-faint); margin-top:1px;}
.iconbtn{
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--emerald-700);
}
.iconbtn:active{background:var(--line);}
.iconbtn.solid{background:var(--emerald-700); color:#fff;}
.iconbtn svg{width:20px;height:20px;}

/* ---------- Content ---------- */
#content{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  position:relative;
  padding-bottom:18px;
}
.fadein{animation:fadein .28s ease both;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.pad{padding:14px 16px;}
.section-title{font-size:15px; font-weight:700; color:var(--ink); margin:4px 2px 10px;}
.section-title span{font-weight:500; color:var(--ink-faint); font-size:12px;}

/* ---------- Hero (home) ---------- */
.hero{
  position:relative; margin:0 0 14px; padding:20px 18px 64px;
  background:
    linear-gradient(180deg, rgba(8,36,28,.55), rgba(8,36,28,.86) 70%, var(--bg) 100%),
    url('https://commons.wikimedia.org/wiki/Special:FilePath/The_Kaaba_during_Hajj.jpg') center 30%/cover no-repeat;
  color:#fff; border-radius:0 0 34px 34px; overflow:hidden;
}
.hero-top{display:flex; align-items:center; justify-content:space-between;}
.brandmark{display:flex; align-items:center; gap:9px;}
.brandmark .b-badge{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(145deg, var(--gold-300), var(--gold-600));
  display:flex; align-items:center; justify-content:center; color:var(--emerald-900); font-weight:800; font-size:13px;
}
.brandmark .b-text{font-weight:800; font-size:15px; letter-spacing:.02em;}
.brandmark .b-text small{display:block; font-weight:500; font-size:10.5px; color:var(--gold-300); letter-spacing:.18em;}
.hero-date{font-size:11.5px; color:var(--gold-100); opacity:.85; text-align:left;}
.hero-mid{margin-top:22px; text-align:center;}
.hero-mid h1{font-family:var(--font-quran); font-size:34px; margin:0 0 4px; font-weight:400;}
.hero-mid p{margin:0; font-size:12.5px; color:var(--gold-100); opacity:.85;}
.hero-search{
  margin-top:18px; display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(6px);
  border-radius:var(--r-pill); padding:10px 14px;
}
.hero-search svg{width:17px;height:17px; color:var(--gold-200,#e8d8ab); flex:0 0 auto;}
.hero-search input{background:none; border:none; outline:none; color:#fff; font-size:13.5px; width:100%;}
.hero-search input::placeholder{color:rgba(255,255,255,.65);}

.continue-card{
  position:relative; margin:-46px 16px 6px; padding:16px 16px;
  background:linear-gradient(120deg, var(--gold-500), var(--gold-700));
  border-radius:var(--r-lg); color:var(--emerald-900); box-shadow:var(--shadow-md);
  display:flex; align-items:center; gap:12px;
}
.continue-card .cc-ic{
  width:44px;height:44px;border-radius:14px; background:rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.continue-card .cc-ic svg{width:22px;height:22px;}
.continue-card .cc-txt{flex:1; min-width:0;}
.continue-card .cc-txt b{display:block; font-size:14.5px; font-weight:800;}
.continue-card .cc-txt span{font-size:11.5px; opacity:.8;}
.continue-card .cc-go{width:34px;height:34px;border-radius:50%; background:rgba(255,255,255,.4); display:flex;align-items:center;justify-content:center;}
.continue-card .cc-go svg{width:16px;height:16px;}

/* ---------- Grid of features ---------- */
.grid6{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;}
.feat{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:16px 8px 12px; text-align:center; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.feat:active{transform:scale(.97);}
.feat .f-ic{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(150deg, var(--emerald-500), var(--emerald-800));
  display:flex; align-items:center; justify-content:center; color:var(--gold-300);
}
.feat .f-ic svg{width:21px;height:21px;}
.feat b{font-size:12.5px; font-weight:700; color:var(--ink);}

/* ---------- Lists / rows ---------- */
.searchbar{
  display:flex; align-items:center; gap:8px; margin:0 16px 12px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-pill);
  padding:10px 14px; box-shadow:var(--shadow-sm);
}
.searchbar svg{width:16px;height:16px; color:var(--ink-faint); flex:0 0 auto;}
.searchbar input{border:none; outline:none; background:none; width:100%; font-size:13.5px; color:var(--ink);}

.list{margin:0 16px; display:flex; flex-direction:column; gap:9px;}
.row{
  display:flex; align-items:center; gap:12px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:11px 12px; box-shadow:var(--shadow-sm);
}
.row:active{background:#FBF9F2;}
.row .r-num{
  flex:0 0 auto; width:38px;height:38px;border-radius:12px;
  background:var(--bg-deep); color:var(--emerald-700);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:13px; border:1px solid var(--line);
}
.row .r-body{flex:1; min-width:0;}
.row .r-body b{display:block; font-size:14px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.row .r-body span{font-size:11.5px; color:var(--ink-faint);}
.row .r-name-ar{font-family:var(--font-quran); font-size:16px;}
.row .r-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.chip{
  font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--r-pill);
  background:var(--emerald-800); color:var(--gold-200,#f0e2ba);
}
.chip.gold{background:var(--gold-100); color:var(--gold-700);}
.iconbtn.ghost{width:34px;height:34px; border:1px solid var(--line); border-radius:50%; color:var(--ink-soft);}
.iconbtn.play{width:36px;height:36px; border-radius:50%; background:var(--emerald-700); color:#fff;}
.iconbtn.play.active{background:var(--gold-600);}
.iconbtn.play svg{width:16px;height:16px;}
.iconbtn.spin svg{animation:spin .8s linear infinite;}

.empty, .err, .loading{margin:30px 16px; text-align:center; color:var(--ink-faint);}
.empty svg, .err svg{width:40px;height:40px; margin-bottom:10px; opacity:.5;}
.err button, .empty button{
  margin-top:12px; display:inline-flex; align-items:center; gap:6px;
  background:var(--emerald-700); color:#fff; padding:9px 18px; border-radius:var(--r-pill); font-size:12.5px; font-weight:700;
}

.skel{margin:16px; display:flex; flex-direction:column; gap:9px;}
.skel-row{height:60px; border-radius:var(--r-md); background:linear-gradient(90deg, #ECE6D5 25%, #F5F1E6 37%, #ECE6D5 63%); background-size:400% 100%; animation:shine 1.4s ease infinite;}
@keyframes shine{0%{background-position:100% 0;}100%{background-position:0 0;}}

/* ---------- Surah reader ---------- */
.reader-toolbar{
  margin:10px 16px 4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.pill-btn{
  display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-pill); padding:8px 13px; font-size:12px; font-weight:700; color:var(--emerald-700); box-shadow:var(--shadow-sm);
}
.pill-btn svg{width:14px;height:14px;}
.surah-hero{
  margin:10px 16px 14px; padding:22px 16px; text-align:center; border-radius:var(--r-lg);
  background:linear-gradient(160deg, var(--emerald-700), var(--emerald-900));
  color:#fff; position:relative; overflow:hidden;
}
.surah-hero::after{
  content:''; position:absolute; inset:0;
  background-image:repeating-linear-gradient(45deg, rgba(203,162,90,.06) 0 2px, transparent 2px 22px);
}
.surah-hero h2{position:relative; font-family:var(--font-quran); font-weight:400; font-size:26px; margin:0 0 4px;}
.surah-hero p{position:relative; font-size:11.5px; color:var(--gold-200,#eadcb2); margin:0; opacity:.85;}

.ayat-wrap{margin:0 16px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 18px; box-shadow:var(--shadow-sm);}
.ayat-txt{
  font-family:var(--font-quran); font-size:23px; line-height:2.35; text-align:justify; color:var(--ink);
}
.ayah-num{
  display:inline-flex; align-items:center; justify-content:center;
  width:28px;height:28px; margin:0 3px; vertical-align:middle;
  border:1.4px solid var(--gold-600); border-radius:50%;
  font-family:var(--font-ui); font-size:11px; font-weight:700; color:var(--gold-700);
}
.ayah-num.active{background:var(--gold-100);}

/* ---------- Mini player ---------- */
#miniplayer{
  flex:0 0 auto; display:none; align-items:center; gap:10px;
  padding:9px 14px; background:var(--emerald-800); color:#fff;
  border-top:1px solid rgba(255,255,255,.08);
}
#miniplayer.show{display:flex;}
#miniplayer .mp-ic{width:34px;height:34px;border-radius:10px; background:rgba(255,255,255,.14); display:flex;align-items:center;justify-content:center; flex:0 0 auto;}
#miniplayer .mp-ic svg{width:16px;height:16px;}
#miniplayer .mp-body{flex:1; min-width:0;}
#miniplayer .mp-title{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#miniplayer .mp-sub{font-size:10px; color:var(--gold-200,#e7d7a8); opacity:.85;}
#miniplayer .mp-bar{height:3px; background:rgba(255,255,255,.2); border-radius:3px; margin-top:5px; overflow:hidden;}
#miniplayer .mp-bar i{display:block; height:100%; width:0%; background:var(--gold-400,#d8b46a);}
#miniplayer .mp-btn{width:32px;height:32px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
#miniplayer .mp-btn svg{width:15px;height:15px;}

/* ---------- Bottom nav ---------- */
#bottomnav{
  flex:0 0 auto; display:flex; align-items:stretch; justify-content:space-between;
  height:var(--nav-h); padding-bottom:var(--safe-b);
  background:var(--card); border-top:1px solid var(--line); position:relative; z-index:20;
}
.navbtn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-faint); font-size:10px; font-weight:600;}
.navbtn svg{width:21px;height:21px;}
.navbtn.active{color:var(--emerald-700);}
.navbtn.active svg{color:var(--gold-600);}

/* ---------- Sheet (bottom modal) ---------- */
.sheet-ov{position:absolute; inset:0; background:rgba(8,25,18,.45); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s ease;}
.sheet-ov.show{opacity:1; pointer-events:auto;}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:81;
  background:var(--bg); border-radius:24px 24px 0 0; box-shadow:0 -12px 30px rgba(0,0,0,.2);
  transform:translateY(105%); transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:78%; display:flex; flex-direction:column;
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:38px;height:4px; background:var(--line-strong); border-radius:3px; margin:10px auto 4px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 12px; border-bottom:1px solid var(--line);}
.sheet-head b{font-size:15px;}
.sheet-body{overflow-y:auto; padding:14px 16px 22px;}

.more-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.more-item{
  display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-md); padding:13px; box-shadow:var(--shadow-sm);
}
.more-item .m-ic{width:38px;height:38px;border-radius:11px; background:var(--bg-deep); color:var(--emerald-700); display:flex; align-items:center;justify-content:center;}
.more-item .m-ic svg{width:18px;height:18px;}
.more-item b{font-size:12.5px;}

.reciter-pick-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 6px; border-bottom:1px solid var(--line);}
.reciter-pick-row:last-child{border-bottom:none;}
.reciter-pick-row b{font-size:13px;}
.reciter-pick-row span{font-size:11px; color:var(--ink-faint); display:block;}

.toast{
  position:absolute; bottom:calc(var(--nav-h) + 14px); left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--emerald-900); color:#fff; padding:9px 18px; border-radius:var(--r-pill);
  font-size:12px; font-weight:600; box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:.25s ease; z-index:200;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

::selection{background:var(--gold-300);}
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="device">

    <div id="splash">
      <div class="splash-mark">٩ ORAN</div>
      <div class="splash-title">القرآن الكريم</div>
      <div class="splash-ring"></div>
    </div>

    <div class="topbar" id="topbar"></div>
    <div id="content"><div class="skel">
      <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
    </div></div>

    <div id="miniplayer">
      <div class="mp-ic" id="mpIcon"></div>
      <div class="mp-body">
        <div class="mp-title" id="mpTitle">—</div>
        <div class="mp-sub" id="mpSub">—</div>
        <div class="mp-bar"><i id="mpProgress"></i></div>
      </div>
      <button class="mp-btn" id="mpToggle"></button>
      <button class="mp-btn" id="mpClose"></button>
    </div>

    <div id="bottomnav"></div>

    <div class="sheet-ov" id="sheetOv"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><b id="sheetTitle"></b><button class="iconbtn ghost" id="sheetClose"></button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   ICONS
   ===================================================================== */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13Z"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M9 21h6"/></svg>',
  radio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="2.4"/><path d="M6.5 10.5a8 8 0 0 1 11 0"/><path d="M3.5 8a12 12 0 0 1 17 0"/><path d="M12 17.4V21"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
  bubble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H9.5L5 19.5v-4H4v-10Z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',

function toArabicDigits(n){
  const map = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
  return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join('');
}
function pad3(n){ return String(n).padStart(3,'0'); }
function showToast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function getJSON(url){
  if(STATE.cache[url]) return STATE.cache[url];
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error('bad-json'); }
  STATE.cache[url] = data;
  return data;
}

/* Robust extraction: API field names vary slightly by endpoint/version,
   so look for the preferred keys first, then fall back to the first
   array found anywhere in the response. */
function pickList(data, preferredKeys){
  if(Array.isArray(data)) return data;
  if(!data || typeof data!=='object') return [];
  for(const k of (preferredKeys||[])){ if(Array.isArray(data[k])) return data[k]; }
  for(const k in data){ if(Array.isArray(data[k])) return data[k]; }
  return [];
}
/* Recursively search an arbitrary JSON shape for the first playable
   audio URL — used where the exact nesting of a response is uncertain. */
function findFirstAudioUrl(obj, depth){
  depth = depth||0; if(depth>6||obj==null) return null;
  if(typeof obj==='string') return /\.mp3(\?|$)/i.test(obj) ? obj : null;
  if(Array.isArray(obj)){ for(const v of obj){ const r=findFirstAudioUrl(v,depth+1); if(r) return r; } return null; }
  if(typeof obj==='object'){
    for(const k of ['url','Url','URL','link','audio']){
      if(typeof obj[k]==='string' && /\.mp3(\?|$)/i.test(obj[k])) return obj[k];
    }
    for(const k in obj){ const r=findFirstAudioUrl(obj[k],depth+1); if(r) return r; }
  }
  return null;
}

/* =====================================================================
   DATA LOADERS (normalized)
   ===================================================================== */
let MASTER_SUWAR = null; // array of {id,nameAr,nameEn,ayahCount,type,startPage,endPage}

async function loadMasterSuwar(){
  if(MASTER_SUWAR) return MASTER_SUWAR;
  const [cloudRes, mp3Res] = await Promise.allSettled([
    getJSON(QURAN_LIST), getJSON(API.suwar)
  ]);
  let cloud = [];
  if(cloudRes.status==='fulfilled'){ cloud = (cloudRes.value.data)||[]; }
  let mp3 = [];
  if(mp3Res.status==='fulfilled'){ mp3 = pickList(mp3Res.value, ['suwar','surah']); }
  const byId = {};
  cloud.forEach(s=>{
    byId[s.number] = {
      id:s.number, nameAr:s.name, nameEn:s.englishName,
      ayahCount:s.numberOfAyahs, type:s.revelationType,
      startPage:null, endPage:null
    };
  });
  mp3.forEach(s=>{
    const id = s.id;
    if(!byId[id]) byId[id] = { id, nameAr:(s.name||'').trim(), nameEn:'', ayahCount:null, type:null, startPage:null, endPage:null };
    byId[id].startPage = s.start_page ?? s.startPage ?? byId[id].startPage;
    byId[id].endPage = s.end_page ?? s.endPage ?? byId[id].endPage;
    if(byId[id].type===null || byId[id].type===undefined){
      byId[id].type = (s.makkia===1 || s.makkia==='1') ? 'Meccan' : 'Medinan';
    }
  });
  const arr = Object.values(byId).sort((a,b)=>a.id-b.id);
  MASTER_SUWAR = arr.length ? arr : null;
  return MASTER_SUWAR;
}
function surahName(id){
  const s = (MASTER_SUWAR||[]).find(x=>x.id===Number(id));
  return s ? s.nameAr : ('سورة '+toArabicDigits(id));
}

const audioEl = new Audio();
audioEl.preload = 'none';

function playTrack(url, title, sub){
  const mp = $('#miniplayer');
  if(STATE.playing && STATE.playing.url===url){
    if(audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause();
  } else {
    audioEl.src = url;
    audioEl.play().catch(()=>showToast('تعذر تشغيل الرابط الصوتي'));
    STATE.playing = {url, title, sub};
    mp.classList.add('show');
    $('#mpTitle').textContent = title || '—';
    $('#mpSub').textContent = sub || '—';
  }
  syncPlayButtons();
  updateMiniIcon();
}
function stopTrack(){
  audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load();
  STATE.playing = null;
  $('#miniplayer').classList.remove('show');
  syncPlayButtons();
}
function updateMiniIcon(){
  $('#mpIcon').innerHTML = ICON.wave;
  $('#mpToggle').innerHTML = audioEl.paused ? ICON.play : ICON.pause;
}
function syncPlayButtons(){
  document.querySelectorAll('[data-track-url]').forEach(btn=>{
    const active = STATE.playing && STATE.playing.url===btn.getAttribute('data-track-url') && !audioEl.paused;
    btn.classList.toggle('active', !!active);
    btn.innerHTML = active ? ICON.pause : ICON.play;
  });
}
audioEl.addEventListener('play', ()=>{ syncPlayButtons(); updateMiniIcon(); });
audioEl.addEventListener('pause', ()=>{ syncPlayButtons(); updateMiniIcon(); });
audioEl.addEventListener('ended', ()=>{ syncPlayButtons(); updateMiniIcon(); });
audioEl.addEventListener('timeupdate', ()=>{
  if(audioEl.duration){
    $('#mpProgress').style.width = ((audioEl.currentTime/audioEl.duration)*100)+'%';
  }
});
$('#mpToggle').addEventListener('click', ()=>{
  if(!STATE.playing) return;
  if(audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause();
});
$('#mpClose').addEventListener('click', stopTrack);
$('#mpToggle').innerHTML = ICON.play;
$('#mpClose').innerHTML = ICON.close;

}

async function playSurahAudio(surahId, name){
  if(STATE.selectedMoshaf && STATE.selectedMoshaf.surahList.has(surahId)){
    const url = STATE.selectedMoshaf.server + pad3(surahId) + '.mp3';
    playTrack(url, 'سورة '+name, STATE.selectedMoshaf.reciterName+' — '+STATE.selectedMoshaf.moshafName);
    return;
  }
  showToast('يرجى اختيار قارئ يشمل هذه السورة');
  openReciterQuickPick(surahId, name);
}

async function openReciterQuickPick(surahId, name){
  openSheet('اختر قارئاً', loadingBlock());
  try{
    const data = await getJSON(API.reciters);
    const reciters = pickList(data, ['reciters','reads']);
    const rows = reciters.filter(r=>(r.moshaf||[]).length).slice(0,60).map(r=>{
      const m = r.moshaf[0];
      return `<div class="reciter-pick-row" data-r="${r.id}"><div><b>${r.name}</b><span>${m.name}</span></div>${ICON.chev}</div>`;
    }).join('');
    $('#sheetBody').innerHTML = rows || emptyBlock('لا يوجد قرّاء.');
    $('#sheetBody').querySelectorAll('[data-r]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const r = reciters.find(x=>String(x.id)===row.getAttribute('data-r'));
        chooseReciterMoshaf(r, surahId, name);
      });
    });
  }catch(e){
    $('#sheetBody').innerHTML = errBlock('تعذر تحميل القرّاء.', ()=>openReciterQuickPick(surahId,name));
  }
}
function chooseReciterMoshaf(reciter, surahId, name){
  const moshafs = reciter.moshaf||[];
  if(moshafs.length<=1){
    setSelectedMoshaf(reciter.name, moshafs[0]);
    closeSheet();
    if(surahId) playSurahAudio(surahId, name || surahName(surahId));
    else render();
    return;
  }
  $('#sheetTitle').textContent = reciter.name;
  $('#sheetBody').innerHTML = moshafs.map(m=>`<div class="reciter-pick-row" data-m="${m.id}"><div><b>${m.name}</b><span>${(m.surah_total||'')+' سورة'}</span></div>${ICON.chev}</div>`).join('');
  $('#sheetBody').querySelectorAll('[data-m]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const m = moshafs.find(x=>String(x.id)===row.getAttribute('data-m'));
      setSelectedMoshaf(reciter.name, m);
      closeSheet();
      if(surahId) playSurahAudio(surahId, name || surahName(surahId));
      else render();
    });
  });
}
function setSelectedMoshaf(reciterName, m){
  if(!m) return;
  const list = new Set((m.surah_list||'').split(',').map(s=>Number(s.trim())).filter(Boolean));
  STATE.selectedMoshaf = { reciterName, moshafName:m.name, server:m.server, surahList:list };
  showToast('تم اختيار: '+reciterName);
}

/* =====================================================================
   GENERIC "SOURCE SURAH LIST WITH PLAY" SCREEN
   used by: reciter->moshaf choice results, moshaf-type filter results, tafasir
   params: {title, subtitle, kind:'serverpad'|'directurl', server, urlMap, surahIds}
   ===================================================================== */
async function renderSourceList(params){
  await loadMasterSuwar().catch(()=>{});
  let ids = [];
  if(params.kind==='directurl'){ ids = Object.keys(params.urlMap).map(Number); }
  else { ids = (params.surahIds||[]).slice(); }
  ids.sort((a,b)=>a-b);
  if(!ids.length){ setContent(emptyBlock('لا توجد سور متاحة لهذا الاختيار.')); return; }
  setContent(`<div class="list">${ids.map(id=>{
    if(params.kind==='lazy'){
      return `<div class="row">
        <div class="r-num">${toArabicDigits(id)}</div>
        <div class="r-body"><b class="r-name-ar">${surahName(id)}</b><span>${params.subtitle||''}</span></div>
        <div class="r-actions"><button class="iconbtn play" data-lazy="${id}">${ICON.play}</button></div>
      </div>`;
    }
    const url = params.kind==='serverpad' ? (params.server+pad3(id)+'.mp3') : params.urlMap[id];
    return `<div class="row">
      <div class="r-num">${toArabicDigits(id)}</div>
      <div class="r-body"><b class="r-name-ar">${surahName(id)}</b><span>${params.subtitle||''}</span></div>
      <div class="r-actions"><button class="iconbtn play" data-track-url="${url}">${ICON.play}</button></div>
    </div>`;
  }).join('')}</div>`);
  $('#content').querySelectorAll('[data-track-url]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const url = btn.getAttribute('data-track-url');
      const id = ids[[...btn.closest('#content').querySelectorAll('[data-track-url],[data-lazy]')].indexOf(btn)];
      playTrack(url, 'سورة '+surahName(id), params.title);
    });
  });
  $('#content').querySelectorAll('[data-lazy]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.resolvedUrl){
        playTrack(btn.dataset.resolvedUrl, btn.dataset.trackTitle, params.title);
        syncPlayButtons();
        return;
      }
      const id = Number(btn.getAttribute('data-lazy'));
      const prevHTML = btn.innerHTML;
      btn.innerHTML = ICON.refresh; btn.classList.add('spin');
      try{
        const url = await params.resolve(id);
        btn.dataset.resolvedUrl = url;
        btn.dataset.trackTitle = 'سورة '+surahName(id);
        btn.setAttribute('data-track-url', url);
        btn.classList.remove('spin');
        playTrack(url, 'سورة '+surahName(id), params.title);
      }catch(e){
        btn.classList.remove('spin');
        btn.innerHTML = prevHTML;
        showToast('لا يتوفر صوت لهذه السورة في هذا التفسير.');
      }
      syncPlayButtons();
    });
  });
  syncPlayButtons();
}

async function renderReciters(){
  setContent(`<div class="searchbar">${ICON.search}<input id="recSearch" placeholder="ابحث عن قارئ…"/></div><div id="recListWrap">${loadingBlock()}</div>`);
  $('#recSearch').addEventListener('input', e=>renderReciterRows(e.target.value));
  try{
    const data = await getJSON(API.reciters);
    STATE._reciters = pickList(data, ['reciters','reads']);
    renderReciterRows('');
  }catch(e){
    $('#recListWrap').innerHTML = errBlock('تعذر تحميل قائمة القرّاء.', renderReciters);
  }
}
function renderReciterRows(q){
  q=(q||'').trim().toLowerCase();
  let list = STATE._reciters||[];
  if(q) list = list.filter(r=>r.name.toLowerCase().includes(q));
  if(!list.length){ $('#recListWrap').innerHTML = emptyBlock('لا يوجد قارئ مطابق.'); return; }
  $('#recListWrap').innerHTML = `<div class="list">${list.map(r=>`
    <div class="row" data-r="${r.id}">
      <div class="r-num">${(r.name||'؟').trim()[0]||'؟'}</div>
      <div class="r-body"><b>${r.name}</b><span>${(r.moshaf||[]).length} مصحف · ${(r.moshaf&&r.moshaf[0])?r.moshaf[0].name:''}</span></div>
      <div class="r-actions">${ICON.chev}</div>
    </div>`).join('')}</div>`;
  $('#recListWrap').querySelectorAll('[data-r]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const r = list.find(x=>String(x.id)===row.getAttribute('data-r'));
      openReciterMoshafPage(r);
    });
  });
}
function openReciterMoshafPage(reciter){
  const moshafs = reciter.moshaf||[];
  if(moshafs.length<=1){
    const m = moshafs[0];
    if(!m){ showToast('لا توجد تلاوات لهذا القارئ.'); return; }
    const ids = (m.surah_list||'').split(',').map(Number).filter(Boolean);
    nav('sourceList',{ title:reciter.name, subtitle:m.name, kind:'serverpad', server:m.server, surahIds:ids });
    return;
  }
  nav('reciterMoshaf', {reciter: reciter.id, reciterName: reciter.name, _list: moshafs});
}
function renderReciterMoshaf(reciterId){

  const moshafs = params._list || [];
  setContent(`<div class="list">${moshafs.map(m=>`
    <div class="row" data-m="${m.id}">
      <div class="r-num">${ICON.grid}</div>
      <div class="r-body"><b>${m.name}</b><span>${m.surah_total||0} سورة</span></div>
      <div class="r-actions">${ICON.chev}</div>
    </div>`).join('')}</div>`);
  $('#content').querySelectorAll('[data-m]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const m = moshafs.find(x=>String(x.id)===row.getAttribute('data-m'));
      const ids = (m.surah_list||'').split(',').map(Number).filter(Boolean);
      nav('sourceList',{ title:params.reciterName, subtitle:m.name, kind:'serverpad', server:m.server, surahIds:ids });
    });
  });
}

/* =====================================================================
   MOSHAF (types) — filters reciters by matching moshaf_type === list.id
   ===================================================================== */
async function renderMoshaf(){
  setContent(loadingBlock());
  try{
    const data = await getJSON(API.moshaf);
    const list = pickList(data, ['moshaf','moshafs']);
    if(!list.length){ setContent(emptyBlock('لا توجد بيانات مصاحف.')); return; }
    setContent(`<div class="list">${list.map(m=>`
      <div class="row" data-mt="${m.id}">
        <div class="r-num">${ICON.grid}</div>
        <div class="r-body"><b>${m.name}</b><span>نوع المصحف</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-mt]').forEach(row=>{
      row.addEventListener('click', ()=>openMoshafTypeResults(list.find(x=>String(x.id)===row.getAttribute('data-mt'))));
    });
  }catch(e){
    setContent(errBlock('تعذر تحميل قائمة المصاحف.', renderMoshaf));
  }
}
async function openMoshafTypeResults(moshafType){
  openSheet(moshafType.name, loadingBlock());
  try{
    const data = await getJSON(API.reciters);
    const reciters = pickList(data, ['reciters','reads']);
    const matches = [];
    reciters.forEach(r=>(r.moshaf||[]).forEach(m=>{ if(m.moshaf_type===moshafType.id) matches.push({r,m}); }));
    if(!matches.length){ $('#sheetBody').innerHTML = emptyBlock('لا يوجد قرّاء مرتبطون بهذا النوع حالياً.'); return; }
    $('#sheetBody').innerHTML = matches.map(({r,m})=>`<div class="reciter-pick-row" data-rid="${r.id}" data-mid="${m.id}"><div><b>${r.name}</b><span>${m.name}</span></div>${ICON.chev}</div>`).join('');
    $('#sheetBody').querySelectorAll('[data-rid]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const found = matches.find(x=>String(x.r.id)===row.getAttribute('data-rid') && String(x.m.id)===row.getAttribute('data-mid'));
        closeSheet();
        const ids = (found.m.surah_list||'').split(',').map(Number).filter(Boolean);
        nav('sourceList',{ title:found.r.name, subtitle:found.m.name, kind:'serverpad', server:found.m.server, surahIds:ids });
      });
    });
  }catch(e){
    $('#sheetBody').innerHTML = errBlock('تعذر تحميل القرّاء.', ()=>openMoshafTypeResults(moshafType));
  }
}

/* =====================================================================
   RIWAYAT — informational list + best-effort reciter match
   ===================================================================== */
async function renderRiwayat(){
  setContent(loadingBlock());
  try{
    const data = await getJSON(API.riwayat);
    const list = pickList(data, ['riwayat','riwayah']);
    if(!list.length){ setContent(emptyBlock('لا توجد بيانات روايات.')); return; }
    setContent(`<div class="list">${list.map(r=>`
      <div class="row" data-rw="${r.id}" data-name="${r.name}">
        <div class="r-num">${ICON.layers}</div>
        <div class="r-body"><b>${r.name}</b><span>رواية قرآنية</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-rw]').forEach(row=>{
      row.addEventListener('click', ()=>openRiwayahResults(row.getAttribute('data-name')));
    });
  }catch(e){
    setContent(errBlock('تعذر تحميل قائمة الروايات.', renderRiwayat));
  }
}
async function openRiwayahResults(riwayahName){
  openSheet(riwayahName, loadingBlock());
  try{
    const data = await getJSON(API.reciters);
    const reciters = pickList(data, ['reciters','reads']);
    const key = riwayahName.replace(/^Rewayat\s*/i,'').split(/\s+/)[0].toLowerCase();
    const matches = [];
    reciters.forEach(r=>(r.moshaf||[]).forEach(m=>{
      if((m.name||'').toLowerCase().includes(key)) matches.push({r,m});
    }));
    if(!matches.length){ $('#sheetBody').innerHTML = emptyBlock('لا يوجد قرّاء مطابقون لهذه الرواية حالياً.'); return; }
    $('#sheetBody').innerHTML = matches.slice(0,80).map(({r,m})=>`<div class="reciter-pick-row" data-rid="${r.id}" data-mid="${m.id}"><div><b>${r.name}</b><span>${m.name}</span></div>${ICON.chev}</div>`).join('');
    $('#sheetBody').querySelectorAll('[data-rid]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const found = matches.find(x=>String(x.r.id)===row.getAttribute('data-rid') && String(x.m.id)===row.getAttribute('data-mid'));
        closeSheet();
        const ids = (found.m.surah_list||'').split(',').map(Number).filter(Boolean);
        nav('sourceList',{ title:found.r.name, subtitle:found.m.name, kind:'serverpad', server:found.m.server, surahIds:ids });
      });
    });
  }catch(e){
    $('#sheetBody').innerHTML = errBlock('تعذر التحميل.', ()=>openRiwayahResults(riwayahName));
  }
}

    const list = pickList(data, ['tafasir','tafaseer']);
    if(!list.length){ setContent(emptyBlock('لا توجد بيانات تفاسير.')); return; }

      <div class="row" data-tf="${t.id}" data-url="${t.url}" data-name="${t.name}">
        <div class="r-num">${ICON.bubble}</div>
        <div class="r-body"><b>${t.name}</b><span>تفسير صوتي</span></div>
        <div class="r-actions">${ICON.chev}</div>
      </div>`).join('')}</div>`);
    $('#content').querySelectorAll('[data-tf]').forEach(row=>{
      row.addEventListener('click', ()=>openTafsirDetail(row.getAttribute('data-url'), row.getAttribute('data-name')));

    setContent(errBlock('تعذر تحميل قائمة التفاسير.', renderTafasir));

async function openTafsirDetail(url, name){
  await loadMasterSuwar().catch(()=>{});
  const ids = (MASTER_SUWAR||[]).map(s=>s.id);
  if(!ids.length){ showToast('تعذر تحميل قائمة السور.'); return; }
  nav('sourceList', {
    title:name, subtitle:'تفسير صوتي', kind:'lazy', surahIds:ids,
    resolve: async (surahId)=>{
      const sep = url.includes('?') ? '&' : '?';
      const data = await getJSON(url+sep+'sura='+surahId);
      const found = findFirstAudioUrl(data);
      if(!found) throw new Error('no-audio');
      return found;
    }
  });
}

function renderBookmarks(){
  if(!STATE.bookmarks.length){ setContent(emptyBlock('لم تُضِف أي إشارات مرجعية بعد. اضغط أيقونة الإشارة أثناء القراءة لحفظ سورة.')); return; }
  const sorted = STATE.bookmarks.slice().sort((a,b)=>b.at-a.at);
  setContent(`<div class="list">${sorted.map(b=>`
    <div class="row" data-open="${b.surah}">
      <div class="r-num">${ICON.bookmarkFill}</div>
      <div class="r-body"><b class="r-name-ar">${b.name}</b><span>${new Date(b.at).toLocaleDateString('ar')}</span></div>
      <div class="r-actions"><button class="iconbtn ghost" data-rm="${b.surah}">${ICON.close}</button></div>
    </div>`).join('')}</div>`);
  $('#content').querySelectorAll('[data-open]').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('[data-rm]')) return;
      nav('reader', {id:row.getAttribute('data-open'), name:surahName(row.getAttribute('data-open'))});
    });
  });
  $('#content').querySelectorAll('[data-rm]').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.stopPropagation(); toggleBookmark(Number(b.getAttribute('data-rm'))); renderBookmarks(); });
  });
}
